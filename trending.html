<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Chart</title>
  <link rel="icon" href="icons/download.png">
  <link rel="stylesheet" href="trending.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
  <header>
    <h1>Trending Chart</h1>
  </header>
  <main>
  <!-- Context menu and playlist popup containers -->
  <div id="song-context-menu" class="song-context-menu" style="display:none; position:absolute; z-index:1000;"></div>
  <div id="playlist-popup" class="playlist-popup" style="display:none; position:absolute; z-index:1100;"></div>
    <table class="playlist-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Album</th>
          <th>Duration</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="trending-body">
        <!-- Trending songs will load here -->
      </tbody>
    </table>
    <div id="you-might-like-section" class="you-might-like-section"></div>
  </main>
  <footer class="player-bar">
  <div id="song-context-menu" class="song-context-menu" style="display:none; position:absolute; z-index:1000;"></div>
    <div class="player-left">
      <img id="now-cover" src="images/default.jpg" alt="Cover">
      <div class="track-info">
        <span id="now-title">Title</span>
        <span id="now-artist">Artist</span>
      </div>
      <i class="bi bi-plus-circle"></i>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <i id="shuffle" class="bi bi-shuffle"></i>
        <i id="prev" class="bi bi-skip-start-fill"></i>
        <i id="play-pause" class="bi bi-play-circle-fill"></i>
        <i id="next" class="bi bi-skip-end-fill"></i>
        <i id="loop" class="bi bi-repeat"></i>
      </div>
      <div class="player-progress">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-bar" min="0" value="0">
        <span id="total-time">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <i class="bi bi-mic"></i>
      <i class="bi bi-list"></i>
      <i class="bi bi-pc-display"></i>
      <i class="bi bi-volume-up"></i>
      <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
      <i class="bi bi-arrows-fullscreen"></i>
    </div>
  </footer>
  <audio id="audio" preload="metadata"></audio>
  <script src="trending.js"></script>
</body>
</html>
