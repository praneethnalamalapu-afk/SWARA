<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playlist</title>
  <link rel="icon" href="icons/download.png">
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
  <div class="spotify-app">
    <!-- Sidebar -->
    <aside class="sidebar spotify-sidebar">
      <div class="sidebar-logo">
        <img src="icons/Swara.png" alt="Logo" style="width:110px;height:90px;">
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active">Home</a>
        <a href="#" class="sidebar-link">Playlists</a>
        <a href="#" class="sidebar-link">Artists</a>
        <a href="#" class="sidebar-link">Albums</a>
      </nav>
      <div class="sidebar-library">
        <div class="sidebar-library-title">Your Library</div>
        <ul class="sidebar-library-list" id="sidebar-library-list"></ul>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main spotify-main">
      <section class="playlist-hero" id="playlist-hero">
        <div class="playlist-hero-covers" id="playlist-hero-covers"></div>
        <div class="playlist-hero-info">
          <div class="playlist-hero-title" id="playlist-hero-title">Playlist Name</div>
          <div class="playlist-hero-meta" id="playlist-hero-meta">
            <span id="playlist-song-count">0 songs</span>,
            <span id="playlist-duration">0 min</span>
            
          </div>
        </div>
      </section>
      <div class="playlist-controls" id="playlist-controls">
        <button id="main-play" class="main-play-btn"><i class="bi bi-play-fill"></i></button>
        <i class="bi bi-shuffle"></i>
        <i class="bi bi-download"></i>
        <i class="bi bi-person-plus"></i>
        <i class="bi bi-three-dots"></i>
      </div>
      <div id="song-context-menu" class="song-context-menu" style="display:none; position:absolute; z-index:1000;"></div>
      <div id="playlist-popup" class="playlist-popup" style="display:none; position:absolute; z-index:1100;"></div>
      <table class="playlist-table" id="playlist-table">
        <thead>
          <tr>
            <th style="width:32px;">#</th>
            <th>Title</th>
            <th>Album</th>
            <th>Date added</th>
            <th style="width:32px;"><i class="bi bi-clock"></i></th>
          </tr>
        </thead>
        <tbody id="playlist-songs"></tbody>
      </table>
      <div id="you-might-like-section" class="you-might-like-section"></div>
    </main>

    <!-- Right Sidebar (Queue) -->
    <aside class="spotify-queue">
      <div class="queue-title">Queue</div>
      <div class="queue-now">Now playing</div>
      <div class="queue-list" id="queue-list">
        <!-- JS can fill this with up next -->
      </div>
    </aside>
  </div>

  <!-- Player Bar -->
  <footer class="player-bar">
    <div class="player-left">
      <img id="now-cover" src="images/default.jpg" alt="Cover">
      <div class="track-info">
        <span id="now-title">Title</span>
        <span id="now-artist">Artist</span>
      </div>
      <i class="bi bi-plus-circle"></i>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <i id="shuffle" class="bi bi-shuffle" title="Shuffle"></i>
        <i id="prev" class="bi bi-skip-start-fill" title="Previous"></i>
        <i id="play-pause" class="bi bi-play-circle-fill" title="Play/Pause"></i>
        <i id="next" class="bi bi-skip-end-fill" title="Next"></i>
        <i id="loop" class="bi bi-repeat" title="Loop"></i>
      </div>
      <div class="player-progress">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-bar" min="0" value="0">
        <span id="total-time">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <i class="bi bi-mic"></i>
      <i class="bi bi-list"></i>
      <i class="bi bi-pc-display"></i>
      <i class="bi bi-volume-up"></i>
      <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
      <i class="bi bi-arrows-fullscreen"></i>
    </div>
  </footer>
  <audio id="audio" preload="metadata"></audio>
  <!-- Context menu and playlist popup containers (moved here for z-index and event handling) -->
  <div id="song-context-menu" class="song-context-menu" style="display:none; position:absolute; z-index:1000;"></div>
  <div id="playlist-popup" class="playlist-popup" style="display:none; position:absolute; z-index:1100;"></div>
  <script src="library.js"></script>
</body>
</html>
