<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Library</title>
  <link rel="icon" href="icons/download.png">
  <link rel="stylesheet" href="musiclibrary.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
  <!-- Sidebar, Player, Search Bar, Queue, etc. -->
  <div id="sidebar"> <!-- ...existing sidebar code... --> </div>
  <div class="spotify-searchbar custom-searchbar">
        <i class="bi bi-search search-icon"></i>
        <input type="text" id="search-bar" placeholder="What do you want to play?" autocomplete="off">
      </div>
  <div id="search-results-container" class="search-results-spotify"></div>

  <footer class="player-bar">
    <!-- Left: Now Playing Info -->
    <div class="player-left">
      <img id="now-cover" src="images/default.jpg" alt="Cover">
      <div class="track-info">
        <span id="now-title">No song playing</span>
        <span id="now-artist">---</span>
      </div>
      <i class="bi bi-plus-circle"></i>
    </div>

    <!-- Center: Controls + Seekbar -->
    <div class="player-center">
      <div class="player-controls">
        <i id="shuffle" class="bi bi-shuffle"></i>
        <i id="prev" class="bi bi-skip-start-fill"></i>
        <i id="play-pause" class="bi bi-play-circle-fill"></i>
        <i id="next" class="bi bi-skip-end-fill"></i>
        <i id="loop" class="bi bi-repeat"></i>
      </div>
      <div class="player-progress">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-bar" min="0" value="0">
        <span id="total-time">0:00</span>
      </div>
    </div>

    <!-- Right: Extra Controls -->
    <div class="player-right">
      <i class="bi bi-mic"></i>
      <i class="bi bi-list"></i>
      <i class="bi bi-pc-display"></i>
      <i class="bi bi-volume-up"></i>
      <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
      <i class="bi bi-arrows-fullscreen"></i>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </footer>
  <div id="search-bar-container"> <!-- ...search bar... --> </div>
  <div id="queue-sidebar">
    <div class="queue-header">Queue <button class="close-btn bi bi-x"></button></div>
    <div id="queue-list"></div>
  </div>

  <main>
    <h2 id="library-title">Music Library</h2>
    <div id="library-grid" class="library-grid"></div>
  </main>

  <script src="musiclibrary.js"></script>
</body>
</html>
